name: Simulation and sequencing validation
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-case-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Test assembly consensus and typing rules
        run: python3 case_study/scripts/test_assembly_analysis.py -v
      - name: Audit committed public-case evidence
        run: python3 case_study/scripts/audit.py --ci
  sequencing:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: nf-core/setup-nextflow@v2
        with:
          version: '25.10.2'
      - name: Install Linux analysis tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fastp bwa samtools bcftools spades ncbi-blast+ iqtree
          command -v iqtree2 || sudo ln -s /usr/bin/iqtree /usr/local/bin/iqtree2
      - name: Record execution environment
        run: |
          mkdir -p results/wgs
          dpkg-query -W fastp bwa samtools bcftools spades ncbi-blast+ iqtree > results/wgs/linux_packages.tsv
          nextflow -version > results/wgs/nextflow_version.txt
          python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Execute Nextflow and truth audit
        run: nextflow run main.nf -ansi-log false
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sequencing-validation
          path: |
            results/wgs/
            .nextflow.log
          retention-days: 14
  r-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.1'
          use-public-rspm: true
      - name: Restore R requirements
        run: Rscript --vanilla scripts/restore.R
      - name: Test simulation and audit committed numerical results
        run: |
          Rscript --vanilla tests/test_simulation.R
          Rscript --vanilla scripts/audit.R
